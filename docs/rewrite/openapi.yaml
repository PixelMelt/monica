        '
      required:
      - id
      - vault_id
      - label
      - stats
      - years
      - year
      - months
      - max_number_of_events
      - created_at
      - updated_at
      properties:
        id:
          $ref: '#/components/schemas/Id'
        vault_id:
          $ref: '#/components/schemas/Uuid'
        label:
          type: string
        stats:
          type: object
          description: Computed; events in the current week, month and year.
          required:
          - weekly_events
          - monthly_events
          - yearly_events
          properties:
            weekly_events:
              type: integer
              minimum: 0
            monthly_events:
              type: integer
              minimum: 0
            yearly_events:
              type: integer
              minimum: 0
        years:
          type: array
          description: Computed; years with at least one event, descending.
          items:
            type: integer
        year:
          type: integer
          description: Year that `months` covers.
        months:
          type: array
          minItems: 12
          maxItems: 12
          description: Computed; events per month of `year`.
          items:
            type: object
            required:
            - month
            - events
