openapi: 3.1.0
info:
  title: Monica API
  version: 1.0.0-draft
  description: 'The single HTTP API of Monica, used by the web SPA and other clients.

    Conventions are in docs/rewrite/api-design.md. Every operation carries

    `x-permission`, `x-inventory` (rows of docs/rewrite/inventory.md it covers)

    and `x-services` (PHP services it ports).

    '
  license:
    name: AGPL-3.0-or-later
    identifier: AGPL-3.0-or-later
servers:
- url: /api/v1
security:
- sessionCookie: []
- bearerToken: []
tags:
- name: Auth
- name: Me
- name: Account
- name: Vaults
- name: Contacts
- name: Contact modules
- name: Groups
- name: Journals
- name: Files
- name: Reference
x-not-api:
- id: R001
  reason: 'SPA route `/`: the SPA redirects to login, the only vault, or the vault list using GET /me/bootstrap'
- id: R003
  reason: 'served outside the API: 301 /.well-known/carddav -> /dav'
- id: R004
  reason: 'served outside the API: 301 /.well-known/caldav -> /dav'
- id: R005
  reason: 'served outside the API: 301 /.well-known/security.txt -> /security.txt'
- id: V004
  reason: SPA page only (forgot password form)
- id: V006
  reason: SPA page only (reset password form)
- id: V010
  reason: SPA page only (verify email notice)
- id: V015
  reason: SPA page only (confirm password form)
- id: V018
  reason: SPA page only (2FA challenge form)
- id: V027
  reason: SPA page only; the markdown is a static asset of the SPA
- id: V028
  reason: SPA page only; the markdown is a static asset of the SPA
- id: V038
  reason: CardDAV/CalDAV at /dav, see api-design.md §11
- id: V039
  reason: health check at /up, outside the API
- id: R002
  reason: The beta banner's dismissed state is per-browser UI state. The SPA keeps it in localStorage
    (today a `beta` cookie set by this route); the server never reads it.
- id: R211
  reason: 'SPA page only (settings index: static links); the administrator flag that hides the account
    section comes from GET /me/bootstrap'
- id: R230
  reason: SPA page only (invite user form); submits to POST /account/users
- id: R235
  reason: 'SPA page only (personalize index: static links)'
- id: R325
  reason: SPA page only (cancel account form); submits to DELETE /account
- id: R039
  reason: SPA page only (create contact form); pick-lists from listGenders, listPronouns, listTemplates,
    and the vault's default_template_id from getVault
- id: R095
  reason: 'SPA page only (add a relationship). Its data comes from getContact,

    listRelationshipGroupTypes, listGenders, listPronouns and the vault

    contact search; the form posts to createContactRelationship.

    '
- id: R013
  reason: SPA page only (create vault form); submits createVault
- id: R026
  reason: 'SPA page only (reports index: links to the report pages)'
- id: R132
  reason: SPA page only (create journal form); it needs no data beyond GET /me/bootstrap
