[package]
name = "monica"
version = "0.1.0"
edition = "2024"
license = "AGPL-3.0-or-later"
publish = false

[dependencies]
aes-gcm = "0.11.1"
anyhow = "1.0.104"
argon2 = "0.6.0"
async-trait = "0.1.92"
axum = "0.8.9"
axum-extra = { version = "0.12.6", features = ["cookie"] }
base64 = "0.23.1"
chrono = { version = "0.4.45", features = ["serde"] }
clap = { version = "4.6.7", features = ["derive"] }
dotenvy = "0.15.7"
hex = "0.4.3"
hmac = "0.13.0"
lettre = { version = "0.11.23", default-features = false, features = ["builder", "smtp-transport", "tokio1-rustls", "ring", "webpki-roots", "hostname", "pool"] }
qrcode = { version = "0.14.1", default-features = false, features = ["svg"] }
rand = "0.10.3"
sea-orm = { version = "2.0.4", default-features = false, features = ["sqlx-sqlite", "sqlx-mysql", "sqlx-postgres", "runtime-tokio-rustls", "macros", "with-chrono", "with-uuid", "with-json", "postgres-array"] }
sea-orm-migration = { version = "2.0.4", default-features = false, features = ["sqlx-sqlite", "sqlx-mysql", "sqlx-postgres", "runtime-tokio-rustls"] }
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.154"
serde_path_to_error = "0.1.20"
sha1 = "0.11.0"
sha2 = "0.11.1"
thiserror = "2.0.21"
time = "0.3.55"
tokio = { version = "1.54.0", features = ["full"] }
totp-rs = { version = "6.0.0", features = ["otpauth", "qr", "gen_secret"] }
tower = "0.5.3"
tower-http = { version = "0.7.1", features = ["trace", "fs", "set-header", "limit"] }
tracing = "0.1.44"
tracing-subscriber = { version = "0.3.23", features = ["env-filter"] }
url = "2.5.8"
utoipa = { version = "6.0.0", features = ["axum_extras", "chrono", "uuid"] }
utoipa-axum = "0.3.0"
uuid = { version = "1.28.0", features = ["v4", "v7", "serde"] }

[dev-dependencies]
http-body-util = "0.1.5"
tokio = { version = "1.54.0", features = ["full"] }
