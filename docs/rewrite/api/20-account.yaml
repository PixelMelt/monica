      properties:
        name: { type: string, minLength: 1, maxLength: 255 }
    RelationshipGroupTypeUpdate:
      type: object
      minProperties: 1
      properties:
        name: { type: string, minLength: 1, maxLength: 255 }
    RelationshipTypeCreate:
      type: object
      required: [name, name_reverse_relationship]
      properties:
        name: { type: string, minLength: 1, maxLength: 255 }
        name_reverse_relationship: { type: string, minLength: 1, maxLength: 255 }
    RelationshipTypeUpdate:
      type: object
      minProperties: 1
      properties:
        name: { type: string, minLength: 1, maxLength: 255 }
        name_reverse_relationship: { type: string, minLength: 1, maxLength: 255 }

