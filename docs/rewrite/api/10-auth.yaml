# Auth (A): instance info, CSRF priming, first-run setup, login, 2FA
# challenge, logout and password confirmation (api-design.md §7). There is no
# email: no verification, no password reset link (`monica reset-password`),
# no invitations (an administrator creates users).

paths:
  # ---------------------------------------------------------------- instance
  /instance:
    get:
      operationId: getInstance
      tags: [Auth]
      summary: Public information about this instance
      description: |
        Feeds the login and first-run setup pages (V001, V008) and the footer.
        The login wallpaper (D008) and help links (D009) are SPA assets.
      x-permission: public
      security: []
      x-inventory: [V001, V008]
      x-services: []
      responses:
        '200':
          description: The instance information.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Instance' }

  # ---------------------------------------------------------------- session
  /auth/csrf:
    get:
      operationId: getCsrfCookie
      tags: [Auth]
      summary: Prime the XSRF-TOKEN cookie
      description: |
        Sets the `XSRF-TOKEN` cookie (and a guest session) so the first
        unsafe request, usually the login, can send `X-XSRF-TOKEN`
        (api-design.md §7.2). Replaces `/sanctum/csrf-cookie`.
      x-permission: public
      security: []
      x-inventory: [V037]
      x-services: []
      responses:
        '204': { $ref: '#/components/responses/NoContent' }

  /auth/register:
    post:
      operationId: registerUser
      tags: [Auth]
      summary: 'First run: create the account and its first user'
      description: |
        Only while no user exists (`setup_required` in GET /instance): creates
        the account with this user as its administrator (locale = the request
        locale, timezone `UTC`), sets it up (J014) and starts a session. After
        that, `403 signup_disabled`; an administrator adds other users.
      x-permission: public
      security: []
      x-inventory: [V009]
      x-services: [CreateNewUser, CreateAccount, SetupAccount]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/Registration' }
      responses:
        '201':
          description: The new user, now logged in.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/CurrentUser' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '422': { $ref: '#/components/responses/ValidationFailed' }
        '429': { $ref: '#/components/responses/RateLimited' }

  /auth/login:
    post:
      operationId: logIn
      tags: [Auth]
      summary: Log in with username and password
      description: |
        Without confirmed 2FA, starts the session (new session id) and returns
        the user. With confirmed 2FA, the session only holds a pending login
        (user id, `remember`) until POST /auth/two-factor-challenge. Usernames
        ignore case. Wrong credentials: 422 on `username`. 5 attempts per
        minute per username and IP.
      x-permission: public
      security: []
      x-inventory: [V002]
      x-services: [RedirectIfTwoFactorAuthenticatable, AttemptToAuthenticate, PrepareAuthenticatedSession]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/LoginCredentials' }
      responses:
        '200':
          description: Logged in, or waiting for the 2FA code.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/LoginResult' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '422': { $ref: '#/components/responses/ValidationFailed' }
        '429': { $ref: '#/components/responses/RateLimited' }

  /auth/two-factor-challenge:
    post:
      operationId: completeTwoFactorChallenge
      tags: [Auth]
      summary: Finish a 2FA login with a TOTP or recovery code
      description: |
        Send `code` or `recovery_code`. A used recovery code is replaced by a
        new one. Uses the `remember` given at login. Wrong code: 422. No
        pending login in the session: 401.
        5 attempts per minute per pending login.
      x-permission: public
      security: []
      x-inventory: [V019]
      x-services: []
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/TwoFactorChallenge' }
      responses:
        '200':
          description: Logged in.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/CurrentUser' }
        '401': { $ref: '#/components/responses/Unauthenticated' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '422': { $ref: '#/components/responses/ValidationFailed' }
        '429': { $ref: '#/components/responses/RateLimited' }

  /auth/logout:
    post:
      operationId: logOut
      tags: [Auth]
      summary: Log out
      description: |
        Ends the cookie session and rotates the CSRF token. Bearer clients
        revoke their token with DELETE /me/tokens/{token_id} instead.
      x-permission: user
      x-inventory: [V003]
      x-services: []
      responses:
        '204': { $ref: '#/components/responses/NoContent' }
        '401': { $ref: '#/components/responses/Unauthenticated' }
        '403': { $ref: '#/components/responses/Forbidden' }

  # ---------------------------------------------------------------- password confirmation
  /auth/confirm-password:
    post:
      operationId: confirmPassword
      tags: [Auth]
      summary: Confirm the password for sensitive actions
      description: |
        Records the confirmation time in the cookie session; sensitive actions
        pass for 3 hours after it (api-design.md §7.4). Wrong password: 422 on
        `password`. A user without a password always passes.
      x-permission: user
      x-inventory: [V017]
      x-services: []
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/PasswordConfirmation' }
      responses:
        '204': { $ref: '#/components/responses/NoContent' }
        '401': { $ref: '#/components/responses/Unauthenticated' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '422': { $ref: '#/components/responses/ValidationFailed' }

  /auth/confirmed-password-status:
    get:
      operationId: getPasswordConfirmationStatus
      tags: [Auth]
      summary: Whether the session confirmed the password recently
      description: |
        Used by the SPA's `ConfirmsPassword` component before a sensitive
        action.
      x-permission: user
      x-inventory: [V016]
      x-services: []
      parameters:
        - name: seconds
          in: query
          description: Window to check, in seconds.
          schema: { type: integer, minimum: 1, default: 10800 }
      responses:
        '200':
          description: The confirmation status.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/PasswordConfirmationStatus' }
        '401': { $ref: '#/components/responses/Unauthenticated' }
        '403': { $ref: '#/components/responses/Forbidden' }

components:
  schemas:
    LocaleCode:
      type: string
      description: A supported locale (`localizer.supported_locales`).
      enum: [en, ar, bn, ca, da, de, es, el, fr, he, hi, it, ja, ml, nl, nn, pa, pl, pt, pt_BR, ro, ru, sv, te, tr, ur, vi, zh_CN, zh_TW]
    Locale:
      type: object
      required: [id, name, dir]
      properties:
        id: { $ref: '#/components/schemas/LocaleCode' }
        name:
          type: string
          description: The language's own name (`auth.lang` in that locale), e.g. `Français`.
        dir: { type: string, enum: [ltr, rtl] }
    Instance:
      type: object
      required: [setup_required, locale, default_locale, locales, version, commit]
      properties:
        setup_required:
          type: boolean
          description: |
            No user exists yet: the first visitor creates the account
            (POST /auth/register); sign-up is closed after that.
        locale:
          $ref: '#/components/schemas/LocaleCode'
          description: |
            The locale of this request: the user's `locale` when logged in,
            else negotiated from `Accept-Language` (X009).
        default_locale: { $ref: '#/components/schemas/LocaleCode' }
        locales:
          type: array
          description: Supported locales, sorted by `name` (collation-aware).
          items: { $ref: '#/components/schemas/Locale' }
        version: { type: string, examples: ['5.0.0-beta.5'] }
        commit:
          type: [string, 'null']
          description: Full commit hash of the build; the footer shows the first 7 characters and links to the repository.
    Username:
      type: string
      minLength: 1
      maxLength: 255
      pattern: '^[^\s:]+$'
      description: |
        What a user signs in with. Kept trimmed and in lower case; unique; no
        whitespace or `:` (CardDAV clients send `username:token`).
    NewPassword:
      type: string
      minLength: 4
      maxLength: 255
      description: |
        X006: in production at least 8 characters with letters, upper and
        lower case, numbers and symbols; otherwise at least 4.
    Registration:
      type: object
      required: [first_name, last_name, username, password, password_confirmation]
      properties:
        first_name: { type: string, minLength: 1, maxLength: 255 }
        last_name: { type: string, minLength: 1, maxLength: 255 }
        username: { $ref: '#/components/schemas/Username' }
        password: { $ref: '#/components/schemas/NewPassword' }
        password_confirmation: { type: string, description: Must equal `password`. }
    LoginCredentials:
      type: object
      required: [username, password]
      properties:
        username: { type: string }
        password: { type: string }
        remember:
          type: boolean
          default: false
          description: Keep the session for 5 years instead of the session lifetime.
    LoginResult:
      type: object
      required: [two_factor, user]
      properties:
        two_factor:
          type: boolean
          description: True when the user has confirmed 2FA; the login is pending until the challenge.
        user:
          description: The logged-in user; null while `two_factor` is true.
          oneOf:
            - $ref: '#/components/schemas/CurrentUser'
            - type: 'null'
    TwoFactorChallenge:
      type: object
      minProperties: 1
      properties:
        code: { type: string, pattern: '^[0-9]{6}$', description: TOTP code. }
        recovery_code: { type: string }
    PasswordConfirmation:
      type: object
      required: [password]
      properties:
        password: { type: string, description: The current password. }
    PasswordConfirmationStatus:
      type: object
      required: [confirmed]
      properties:
        confirmed: { type: boolean }
