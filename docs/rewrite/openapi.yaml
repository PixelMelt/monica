            X008).
        locale:
          $ref: '#/components/schemas/LocaleCode'
          description: 'The locale of this request: the user''s `locale` when logged in,

            else negotiated from `Accept-Language` (X009).

            '
        default_locale:
          $ref: '#/components/schemas/LocaleCode'
        locales:
          type: array
          description: Supported locales, sorted by `name` (collation-aware).
          items:
            $ref: '#/components/schemas/Locale'
        version:
          type: string
          examples:
          - 5.0.0-beta.5
        commit:
          type:
          - string
          - 'null'
          description: Full commit hash of the build; the footer shows the first 7 characters and links
            to the repository.
        features:
          type: object
          required:
          - account_deletion
          properties:
            account_deletion:
              type: boolean
              description: DELETE /me is enabled (server flag, off by default, V032).
    Invitation:
      type: object
      required:
