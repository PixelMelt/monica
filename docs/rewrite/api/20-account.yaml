# Account administration (area B1): the account, its users, and the
# personalization lists used by contact forms. A single-user install has no
# storage quota and no account cancellation. Reads are open to every
# account member; writes need the account administrator (api-design.md §2, §9).

x-not-api:
  - { id: R211, reason: "SPA page only (settings index: static links); the administrator flag that hides the account section comes from GET /me/bootstrap" }
  - { id: R230, reason: "SPA page only (add user form); submits to POST /account/users" }
  - { id: R235, reason: "SPA page only (personalize index: static links)" }

paths:
  /account:
    get:
      operationId: getAccount
      tags: [Account]
      summary: Get the current user's account
      x-permission: account:member
      x-inventory: []
      x-services: []
      responses:
        '200':
          description: The account.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Account' }
        '401': { $ref: '#/components/responses/Unauthenticated' }
        '403': { $ref: '#/components/responses/Forbidden' }

  /account/emotions:
    get:
      operationId: listEmotions
      tags: [Account]
      summary: List the account's emotions
      description: Seeded per account at signup; there is no management UI. Ordered by id.
      x-permission: account:member
      x-inventory: []
      x-services: []
      responses:
        '200':
          description: All emotions, not paginated.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/EmotionList' }
        '401': { $ref: '#/components/responses/Unauthenticated' }
        '403': { $ref: '#/components/responses/Forbidden' }

  # ------------------------------------------------------------------ users
  /account/users:
    get:
      operationId: listAccountUsers
      tags: [Account]
      summary: List the users of the account
      description: |
        Ordered by `created_at`. The client marks the current user by
        comparing ids with GET /me/bootstrap.
      x-permission: account:member
      x-inventory: [R229, R330]
      x-services: []
      responses:
        '200':
          description: All users of the account, not paginated.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/AccountUserList' }
        '401': { $ref: '#/components/responses/Unauthenticated' }
        '403': { $ref: '#/components/responses/Forbidden' }
    post:
      operationId: createAccountUser
      tags: [Account]
      summary: Add a user, with a username and a first password
      description: |
        In place of email invitations: the administrator gives the new user a
        username and a first password, which they can change in their profile.
      x-permission: account:admin
      x-inventory: [R231]
      x-services: [CreateUser]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/AccountUserCreate' }
      responses:
        '201':
          description: The new user.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/AccountUser' }
        '401': { $ref: '#/components/responses/Unauthenticated' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '422': { $ref: '#/components/responses/ValidationFailed' }

  /account/users/{user_id}:
    parameters:
      - name: user_id
        in: path
        required: true
        schema: { $ref: '#/components/schemas/Uuid' }
    get:
      operationId: getAccountUser
      tags: [Account]
      summary: Get a user of the account
      x-permission: account:member
      x-inventory: [R331]
      x-services: []
      responses:
        '200':
          description: The user.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/AccountUser' }
        '401': { $ref: '#/components/responses/Unauthenticated' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
    patch:
      operationId: updateAccountUser
      tags: [Account]
      summary: Give or remove the administrator privilege
      description: Removing your own privilege is a 409.
      x-permission: account:admin
      x-inventory: [R233]
      x-services: [GiveAdministratorPrivilege, RemoveAdministratorPrivilege]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/AccountUserUpdate' }
      responses:
        '200':
          description: The updated user.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/AccountUser' }
        '401': { $ref: '#/components/responses/Unauthenticated' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409': { $ref: '#/components/responses/Conflict' }
        '422': { $ref: '#/components/responses/ValidationFailed' }
    delete:
      operationId: deleteAccountUser
      tags: [Account]
      summary: Delete a user of the account
      description: |
        Needs a password confirmation (api-design.md §7.4). Also deletes every
        vault the user manages that has no other manager. Deleting yourself is
        a 409.
      x-permission: account:admin
      x-inventory: [R234]
      x-services: [DestroyUser]
      requestBody:
        required: false
        content:
          application/json:
            schema: { $ref: '#/components/schemas/DeleteAccountUserRequest' }
      responses:
        '204': { $ref: '#/components/responses/NoContent' }
        '401': { $ref: '#/components/responses/Unauthenticated' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409': { $ref: '#/components/responses/Conflict' }
        '422': { $ref: '#/components/responses/ValidationFailed' }

