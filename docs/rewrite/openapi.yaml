        password_confirmation:
          type: string
          description: Must equal `password`.
    NewPassword:
      type: string
      minLength: 4
      maxLength: 255
      description: 'X006: in production at least 8 characters with letters, upper and

        lower case, numbers and symbols; otherwise at least 4.

        '
    Registration:
      type: object
      required:
      - first_name
      - last_name
      - email
      - password
      - password_confirmation
      - terms
      properties:
        first_name:
          type: string
          minLength: 1
          maxLength: 255
        last_name:
          type: string
          minLength: 1
          maxLength: 255
        email:
          type: string
          format: email
          maxLength: 255
          description: Unique across users.
        password:
          $ref: '#/components/schemas/NewPassword'
        password_confirmation:
          type: string
          description: Must equal `password`.
        terms:
          type: boolean
          const: true
          description: Accepts the terms of service and privacy policy.
    LoginCredentials:
      type: object
      required:
      - email
      - password
      properties:
        email:
          type: string
        password:
          type: string
        remember:
          type: boolean
