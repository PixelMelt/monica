components:
  securitySchemes:
    sessionCookie:
      type: apiKey
      in: cookie
      name: monica_session
      description: 'Browser session. Unsafe methods also need the `X-XSRF-TOKEN` header

        equal to the `XSRF-TOKEN` cookie (api-design.md §7.2).

        '
    bearerToken:
      type: http
      scheme: bearer
      description: Personal access token with abilities `read` and/or `write`.
  parameters:
    VaultId:
      name: vault_id
      in: path
      required: true
      schema:
        $ref: '#/components/schemas/Uuid'
    ContactId:
      name: contact_id
      in: path
      required: true
      schema:
        $ref: '#/components/schemas/Uuid'
    JournalId:
      name: journal_id
      in: path
      required: true
      schema:
        $ref: '#/components/schemas/Id'
    PostId:
      name: post_id
      in: path
      required: true
      schema:
        $ref: '#/components/schemas/Id'
    Page:
      name: page
      in: query
      schema:
        type: integer
        minimum: 1
        default: 1
    PerPage:
      name: per_page
      in: query
      description: Page size. The default is set per endpoint; the maximum is 100.
      schema:
        type: integer
        minimum: 1
        maximum: 100
    Query:
      name: q
      in: query
      description: Search text (LIKE match on the searchable columns).
      schema:
        type: string
        maxLength: 255
    InvitationCode:
      name: invitation_code
      in: path
      required: true
      schema:
        $ref: '#/components/schemas/Uuid'
    NotificationChannelId:
      name: notification_channel_id
      in: path
      required: true
      schema:
        $ref: '#/components/schemas/Id'
    TimelineEventId:
      name: timeline_event_id
      in: path
      required: true
      description: A timeline event in the vault that the contact takes part in.
      schema:
        $ref: '#/components/schemas/Id'
    GroupId:
      name: group_id
      in: path
      required: true
      schema:
        $ref: '#/components/schemas/Id'
  responses:
    NoContent:
      description: Done; no body.
    BadRequest:
      description: Malformed request.
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/Problem'
    Unauthenticated:
      description: No valid session or token (`unauthenticated`).
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/Problem'
    Forbidden:
      description: '`forbidden`, `csrf_token_mismatch`, `email_not_verified`,

        `token_ability_missing`, `password_confirmation_required` or

        `signup_disabled`.

        '
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/Problem'
    NotFound:
      description: Doesn't exist or isn't visible to the user (`not_found`).
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/Problem'
    Conflict:
      description: State or uniqueness conflict (`conflict`).
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/Problem'
    PayloadTooLarge:
      description: Upload above the per-file limit (`payload_too_large`).
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/Problem'
    ValidationFailed:
      description: '`validation_failed` (with `errors`), `storage_limit_exceeded` or

        `vault_user_limit_reached`.

        '
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/Problem'
    RateLimited:
      description: Too many requests (`rate_limited`); see `Retry-After`.
      headers:
        Retry-After:
          schema:
            type: integer
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/Problem'
  schemas:
    Id:
      type: integer
      format: int64
      minimum: 1
    Uuid:
      type: string
      format: uuid
    Timestamp:
      type: string
      format: date-time
      description: RFC 3339, UTC, `Z` suffix.
      examples:
      - '2025-08-09T22:32:20Z'
    Date:
      type: string
      format: date
      examples:
      - '2025-08-09'
    Problem:
      type: object
      required:
      - type
      - status
      - code
      - title
      properties:
        type:
          type: string
          default: about:blank
        status:
          type: integer
        code:
          type: string
          enum:
          - bad_request
          - unauthenticated
          - csrf_token_mismatch
          - email_not_verified
          - forbidden
          - token_ability_missing
          - password_confirmation_required
          - signup_disabled
          - not_found
          - conflict
          - payload_too_large
          - validation_failed
          - storage_limit_exceeded
          - vault_user_limit_reached
          - rate_limited
          - internal_error
        title:
          type: string
          description: Human-readable
          in the request locale.: null
        detail:
          type: string
        errors:
          type: array
          items:
            $ref: '#/components/schemas/FieldError'
    FieldError:
      type: object
      required:
      - field
      - code
      - message
      properties:
        field:
          type: string
          description: JSON path into the request body.
        code:
          type: string
          description: 'Rule that failed: required, max, min, uuid, exists, enum, format, unique, …'
        message:
          type: string
        params:
          type: object
          additionalProperties: true
    PaginationMeta:
      type: object
      required:
      - page
      - per_page
      - total
      - last_page
      properties:
        page:
          type: integer
          minimum: 1
        per_page:
          type: integer
          minimum: 1
        total:
          type: integer
          minimum: 0
        last_page:
          type: integer
          minimum: 1
    PartialDate:
      type: object
      description: A date where any part may be unknown.
      required:
      - day
      - month
      - year
      properties:
        day:
          type:
          - integer
          - 'null'
          minimum: 1
          maximum: 31
        month:
          type:
          - integer
          - 'null'
          minimum: 1
          maximum: 12
        year:
          type:
          - integer
          - 'null'
    ContactSummary:
      type: object
      description: 'Enough to show a contact anywhere: the client builds the display name

        from the user''s `name_order` and fetches the avatar from

        GET /vaults/{vault_id}/contacts/{contact_id}/avatar.

        '
      required:
      - id
      - vault_id
      - first_name
      - middle_name
      - last_name
      - nickname
      - maiden_name
      - prefix
      - suffix
      - avatar_file_id
      - listed
      properties:
        id:
          $ref: '#/components/schemas/Uuid'
        vault_id:
          $ref: '#/components/schemas/Uuid'
        first_name:
          type:
          - string
          - 'null'
        middle_name:
          type:
          - string
          - 'null'
        last_name:
          type:
          - string
          - 'null'
        nickname:
          type:
          - string
          - 'null'
        maiden_name:
          type:
          - string
          - 'null'
        prefix:
          type:
          - string
          - 'null'
        suffix:
          type:
          - string
          - 'null'
        avatar_file_id:
          type:
          - integer
          - 'null'
          format: int64
        listed:
          type: boolean
