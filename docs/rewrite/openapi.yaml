        '401':
          $ref: '#/components/responses/Unauthenticated'
        '403':
          $ref: '#/components/responses/Forbidden'
    delete:
      operationId: cancelAccount
      tags:
      - Account
      summary: Cancel the account
      description: 'Needs a password confirmation (api-design.md §7.4). Queues the deletion

        of the account with all its users, vaults, contacts and files (J018);

        the client then goes to the login page.

        '
      x-permission: account:admin
      x-inventory:
      - R326
      x-services:
      - CancelAccount
      requestBody:
        required: false
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CancelAccountRequest'
      responses:
        '202':
          description: Deletion queued; no body.
        '401':
          $ref: '#/components/responses/Unauthenticated'
        '403':
          $ref: '#/components/responses/Forbidden'
        '422':
          $ref: '#/components/responses/ValidationFailed'
