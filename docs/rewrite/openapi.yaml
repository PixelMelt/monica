    AddressBookSubscription:
      type: object
      description: A row of `addressbook_subscriptions`. The password is never returned.
      required:
      - id
      - user_id
      - vault_id
      - uri
      - username
      - active
      - sync_way
      - capabilities
      - frequency
      - last_synchronized_at
      - created_at
      - updated_at
      properties:
        id:
          $ref: '#/components/schemas/Uuid'
        user_id:
          $ref: '#/components/schemas/Uuid'
          description: The user the sync acts as (the creator).
        vault_id:
          $ref: '#/components/schemas/Uuid'
        uri:
          type: string
          maxLength: 2096
          description: The discovered address book URL.
        username:
          type: string
          maxLength: 1024
        active:
          type: boolean
        sync_way:
          type: integer
          enum:
          - 1
          - 2
          - 3
          description: Bit mask; 1 push local changes, 2 get remote changes, 3 both.
        capabilities:
          type: object
          description: What the remote server supports, found at discovery.
          properties:
            addressbookMultiget:
              type: boolean
            addressbookQuery:
              type: boolean
            syncCollection:
              type: boolean
            addressData:
              type: object
              properties:
                content-type:
                  type: string
                version:
                  type: string
        frequency:
          type: integer
          description: Minutes between automatic syncs.
        last_synchronized_at:
          oneOf:
          - $ref: '#/components/schemas/Timestamp'
          - type: 'null'
        created_at:
          $ref: '#/components/schemas/Timestamp'
        updated_at:
          $ref: '#/components/schemas/Timestamp'
    AddressBookSubscriptionList:
      type: object
      required:
      - data
      properties:
        data:
          type: array
          items:
            $ref: '#/components/schemas/AddressBookSubscription'
    AddressBookSubscriptionCreate:
      type: object
      required:
      - base_uri
      - username
      - password
      properties:
        base_uri:
          type: string
          format: uri
          maxLength: 2096
          description: The server or address book URL to discover from.
        username:
          type: string
          minLength: 1
          maxLength: 1024
        password:
          type: string
          minLength: 1
          writeOnly: true
          description: Stored encrypted.
        sync_way:
          type: integer
          enum:
          - 1
          - 2
          - 3
          default: 3
    AddressBookSubscriptionUpdate:
      type: object
      minProperties: 1
      properties:
        username:
          type: string
          minLength: 1
          maxLength: 1024
        password:
          type: string
          minLength: 1
          writeOnly: true
        active:
          type: boolean
        sync_way:
          type: integer
          enum:
          - 1
          - 2
          - 3
        frequency:
          type: integer
          minimum: 1
          maximum: 32767
