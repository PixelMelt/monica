# Current user (A): profile, password, preferences, 2FA management, browser
# sessions, personal access tokens, notification channels, layout bootstrap.
#
# Sensitive actions (api-design.md §7.4) take an optional `PasswordConfirmation`
# body: they pass when the cookie session confirmed the password in the last
# 3 hours or the body carries the current password, else
# 403 `password_confirmation_required`.
paths:
  # ---------------------------------------------------------------- profile
  /me:
    get:
      operationId: getMe
      tags: [Me]
      summary: The logged-in user
      description: |
        Also replaces `GET /api/user` (R329) and the user part of the profile
        page (V029). No verified email needed.
      x-permission: user
      x-inventory: [R329, V029]
      x-services: []
      responses:
        '200':
          description: The user.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/CurrentUser' }
        '401': { $ref: '#/components/responses/Unauthenticated' }
        '403': { $ref: '#/components/responses/Forbidden' }
    patch:
      operationId: updateMe
      tags: [Me]
      summary: Update name and email
      description: |
        Changing `email` clears `email_verified_at` and sends the verification
        email (E005). No verified email needed.
      x-permission: user
      x-inventory: [V013]
      x-services: [UpdateUserProfileInformation]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/CurrentUserUpdate' }
      responses:
        '200':
          description: The updated user.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/CurrentUser' }
        '401': { $ref: '#/components/responses/Unauthenticated' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '422': { $ref: '#/components/responses/ValidationFailed' }
    delete:
      operationId: deleteMe
      tags: [Me]
      summary: Delete my user
      description: |
        Only when the server flag `ENABLE_ACCOUNT_DELETION` is on. It defaults
        to off, and then this answers 404, as today where the route isn't
        registered (`Instance.features.account_deletion`). Deletes the user and
        the vaults they are the only manager of (DestroyUser), then ends the
        session. 409 when they are the account's last administrator.
        Sensitive action. No verified email needed.
      x-permission: user
      x-inventory: [V032]
      x-services: [DeleteUser, DestroyUser]
      requestBody:
        required: false
        content:
          application/json:
            schema: { $ref: '#/components/schemas/PasswordConfirmation' }
      responses:
        '204': { $ref: '#/components/responses/NoContent' }
        '401': { $ref: '#/components/responses/Unauthenticated' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409': { $ref: '#/components/responses/Conflict' }
        '422': { $ref: '#/components/responses/ValidationFailed' }

  /me/bootstrap:
    get:
      operationId: getBootstrap
      tags: [Me]
      summary: Everything the layout needs, in one call
      description: |
        Aggregate (api-design.md §12) replacing `VaultIndexViewHelper::layoutData`
        and the shared Inertia props: the user with preferences, their vaults
        with permission and tab visibility, and the instance info (footer
        version). No verified email needed.
      x-permission: user
      x-inventory: []
      x-services: []
      responses:
        '200':
          description: The layout data.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Bootstrap' }
        '401': { $ref: '#/components/responses/Unauthenticated' }
        '403': { $ref: '#/components/responses/Forbidden' }

  /me/password:
    put:
      operationId: updateMyPassword
      tags: [Me]
      summary: Change my password
      description: |
        Wrong `current_password`: 422 on it. Deletes pending reset tokens and
        ends the user's other sessions (today through `AuthenticateSession`);
        the current session stays. No verified email needed.
      x-permission: user
      x-inventory: [V014]
      x-services: [UpdateUserPassword]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/PasswordUpdate' }
      responses:
        '204': { $ref: '#/components/responses/NoContent' }
        '401': { $ref: '#/components/responses/Unauthenticated' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '422': { $ref: '#/components/responses/ValidationFailed' }

  # ---------------------------------------------------------------- preferences
  /me/preferences:
    get:
      operationId: getMyPreferences
      tags: [Me]
      summary: My display preferences
      description: |
        Feeds the preferences page (R212). Its option lists are the enums of
        `UserPreferences`, the locales come from getInstance and the timezones
        from listReferenceTimezones; the formatted examples (name, dates,
        numbers) are built by the client.
      x-permission: user
      x-inventory: [R212]
      x-services: []
      responses:
        '200':
          description: The preferences.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/UserPreferences' }
        '401': { $ref: '#/components/responses/Unauthenticated' }
        '403': { $ref: '#/components/responses/Forbidden' }
    patch:
      operationId: updateMyPreferences
      tags: [Me]
      summary: Change one or more preferences
      description: |
        One field per former form (R213–R220) plus the contacts list sort
        (R038). `help_shown` is set, not flipped.
      x-permission: user
      x-inventory: [R038, R213, R214, R215, R216, R217, R218, R219, R220]
      x-services: [StoreNameOrderPreference, StoreDateFormatPreference, StoreTimezone, StoreNumberFormatPreference, StoreDistanceFormatPreference, StoreMapsPreference, StoreLocale, StoreHelpPreference, UpdateContactSortOrder]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/UserPreferencesUpdate' }
      responses:
        '200':
          description: The updated preferences.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/UserPreferences' }
        '401': { $ref: '#/components/responses/Unauthenticated' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '422': { $ref: '#/components/responses/ValidationFailed' }

  # ---------------------------------------------------------------- two-factor authentication
  /me/two-factor:
    post:
      operationId: enableTwoFactor
      tags: [Me]
      summary: Start enabling 2FA
      description: |
        Generates a TOTP secret and 8 recovery codes, replacing an unconfirmed
        secret. 2FA is active only after confirmTwoFactor. 409 when 2FA is
        already confirmed. Sensitive action. No verified email needed.
      x-permission: user
      x-inventory: [V020, V023, V024]
      x-services: [EnableTwoFactorAuthentication]
      requestBody:
        required: false
        content:
          application/json:
            schema: { $ref: '#/components/schemas/PasswordConfirmation' }
      responses:
        '200':
          description: What the authenticator app needs.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/TwoFactorSetup' }
        '401': { $ref: '#/components/responses/Unauthenticated' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '409': { $ref: '#/components/responses/Conflict' }
        '422': { $ref: '#/components/responses/ValidationFailed' }
    delete:
      operationId: disableTwoFactor
      tags: [Me]
      summary: Disable 2FA
      description: |
        Clears the secret, recovery codes and confirmation. Sensitive action.
        No verified email needed.
      x-permission: user
      x-inventory: [V022]
      x-services: [DisableTwoFactorAuthentication]
      requestBody:
        required: false
        content:
          application/json:
            schema: { $ref: '#/components/schemas/PasswordConfirmation' }
      responses:
        '204': { $ref: '#/components/responses/NoContent' }
        '401': { $ref: '#/components/responses/Unauthenticated' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '422': { $ref: '#/components/responses/ValidationFailed' }

  /me/two-factor/confirm:
    post:
      operationId: confirmTwoFactor
      tags: [Me]
      summary: Confirm 2FA with a code from the app
      description: |
        Sets `two_factor_confirmed_at`; from then on login asks for a code.
        Wrong code or no pending secret: 422 on `code`. No verified email
        needed.
      x-permission: user
      x-inventory: [V021]
      x-services: [ConfirmTwoFactorAuthentication]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/TwoFactorConfirm' }
      responses:
        '204': { $ref: '#/components/responses/NoContent' }
        '401': { $ref: '#/components/responses/Unauthenticated' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '422': { $ref: '#/components/responses/ValidationFailed' }

  /me/two-factor/recovery-codes:
    get:
      operationId: getTwoFactorRecoveryCodes
      tags: [Me]
      summary: Show the recovery codes
      description: |
        Empty list when 2FA has no secret. Sensitive action; as a GET has no
        body, it needs the session confirmation (bearer clients regenerate
        instead). No verified email needed.
      x-permission: user
      x-inventory: [V025]
      x-services: []
      responses:
        '200':
          description: The current recovery codes.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/TwoFactorRecoveryCodes' }
        '401': { $ref: '#/components/responses/Unauthenticated' }
        '403': { $ref: '#/components/responses/Forbidden' }
    post:
      operationId: regenerateTwoFactorRecoveryCodes
      tags: [Me]
      summary: Replace the recovery codes with 8 new ones
      description: |
        409 when 2FA has no secret. Sensitive action. No verified email needed.
      x-permission: user
      x-inventory: [V026]
      x-services: [GenerateNewRecoveryCodes]
      requestBody:
        required: false
        content:
          application/json:
            schema: { $ref: '#/components/schemas/PasswordConfirmation' }
      responses:
        '200':
          description: The new recovery codes.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/TwoFactorRecoveryCodes' }
        '401': { $ref: '#/components/responses/Unauthenticated' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '409': { $ref: '#/components/responses/Conflict' }
        '422': { $ref: '#/components/responses/ValidationFailed' }

  # ---------------------------------------------------------------- browser sessions
  /me/sessions:
    get:
      operationId: listMySessions
      tags: [Me]
      summary: My browser sessions
      description: |
        Rows of `sessions` for this user, most recently active first, for the
        profile page (V029). Session ids are never returned. No verified email
        needed.
      x-permission: user
      x-inventory: [V029]
      x-services: []
      responses:
        '200':
          description: The sessions.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/SessionList' }
        '401': { $ref: '#/components/responses/Unauthenticated' }
        '403': { $ref: '#/components/responses/Forbidden' }

  /me/sessions/log-out-others:
    post:
      operationId: logOutOtherSessions
      tags: [Me]
      summary: Log out every other browser session
      description: |
        Deletes this user's `sessions` rows except the current one (X026).
        Sensitive action; wrong password: 422 on `password`. No verified email
        needed.
      x-permission: user
      x-inventory: [V030]
      x-services: []
      requestBody:
        required: false
        content:
          application/json:
            schema: { $ref: '#/components/schemas/PasswordConfirmation' }
      responses:
        '204': { $ref: '#/components/responses/NoContent' }
        '401': { $ref: '#/components/responses/Unauthenticated' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '422': { $ref: '#/components/responses/ValidationFailed' }

  # ---------------------------------------------------------------- personal access tokens
  /me/tokens:
    get:
      operationId: listMyTokens
      tags: [Me]
      summary: My personal access tokens
      description: Ordered by `created_at`. The token values are never returned again.
      x-permission: user
      x-inventory: [V033]
      x-services: []
      responses:
        '200':
          description: The tokens.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/PersonalAccessTokenList' }
        '401': { $ref: '#/components/responses/Unauthenticated' }
        '403': { $ref: '#/components/responses/Forbidden' }
    post:
      operationId: createMyToken
      tags: [Me]
      summary: Create a personal access token
      description: |
        Returns the plain-text token once; only its SHA-256 is stored (X027).
        Cookie session only: a bearer token gets 403 `forbidden`.
      x-permission: user
      x-inventory: [V034]
      x-services: []
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/PersonalAccessTokenCreate' }
      responses:
        '201':
          description: The token and its plain-text value.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/PersonalAccessTokenCreated' }
        '401': { $ref: '#/components/responses/Unauthenticated' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '422': { $ref: '#/components/responses/ValidationFailed' }

  /me/tokens/{token_id}:
    parameters:
      - name: token_id
        in: path
        required: true
        schema: { $ref: '#/components/schemas/Id' }
    patch:
      operationId: updateMyToken
      tags: [Me]
      summary: Change a token's abilities
      description: Cookie session only, so a token can't widen its own abilities.
      x-permission: user
      x-inventory: [V035]
      x-services: []
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/PersonalAccessTokenUpdate' }
      responses:
        '200':
          description: The updated token.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/PersonalAccessToken' }
        '401': { $ref: '#/components/responses/Unauthenticated' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '422': { $ref: '#/components/responses/ValidationFailed' }
    delete:
      operationId: deleteMyToken
      tags: [Me]
      summary: Revoke a token
      x-permission: user
      x-inventory: [V036]
      x-services: []
      responses:
        '204': { $ref: '#/components/responses/NoContent' }
        '401': { $ref: '#/components/responses/Unauthenticated' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }

  # ---------------------------------------------------------------- notification channels
  /me/notification-channels:
    get:
      operationId: listNotificationChannels
      tags: [Me]
      summary: My reminder notification channels
      description: Email channels (Telegram is removed), ordered by `id`.
      x-permission: user
      x-inventory: [R221]
      x-services: []
      responses:
        '200':
          description: The channels.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/NotificationChannelList' }
        '401': { $ref: '#/components/responses/Unauthenticated' }
        '403': { $ref: '#/components/responses/Forbidden' }
    post:
      operationId: createNotificationChannel
      tags: [Me]
      summary: Add an email address to be notified at
      description: |
        Creates an inactive, unverified channel with a new `verification_token`
        and queues the verification email (J015, E004), whose link opens the
        SPA at `/settings/notifications/{id}/verify/{token}`. An address already
        used by any channel is a 422 on `content`.
      x-permission: user
      x-inventory: [R222]
      x-services: [CreateUserNotificationChannel]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/NotificationChannelCreate' }
      responses:
        '201':
          description: The created channel.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/NotificationChannel' }
        '401': { $ref: '#/components/responses/Unauthenticated' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '422': { $ref: '#/components/responses/ValidationFailed' }

  /me/notification-channels/{notification_channel_id}:
    parameters:
      - $ref: '#/components/parameters/NotificationChannelId'
    get:
      operationId: getNotificationChannel
      tags: [Me]
      summary: One notification channel
      description: The header of the channel's log page (R228).
      x-permission: user
      x-inventory: [R228]
      x-services: []
      responses:
        '200':
          description: The channel.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/NotificationChannel' }
        '401': { $ref: '#/components/responses/Unauthenticated' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
    patch:
      operationId: updateNotificationChannel
      tags: [Me]
      summary: Activate or deactivate a channel
      description: |
        Activating resets `fails` to 0 and schedules the user's contact
        reminders on the channel; deactivating deletes its scheduled reminders.
      x-permission: user
      x-inventory: [R226]
      x-services: [ToggleUserNotificationChannel, ScheduleAllContactRemindersForNotificationChannel]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/NotificationChannelUpdate' }
      responses:
        '200':
          description: The updated channel.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/NotificationChannel' }
        '401': { $ref: '#/components/responses/Unauthenticated' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '422': { $ref: '#/components/responses/ValidationFailed' }
    delete:
      operationId: deleteNotificationChannel
      tags: [Me]
      summary: Delete a channel
      description: Also deletes its scheduled reminders and its log.
      x-permission: user
      x-inventory: [R227]
      x-services: [DestroyUserNotificationChannel]
      responses:
        '204': { $ref: '#/components/responses/NoContent' }
        '401': { $ref: '#/components/responses/Unauthenticated' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }

  /me/notification-channels/{notification_channel_id}/test:
    post:
      operationId: sendNotificationChannelTest
      tags: [Me]
      summary: Send a test email to the channel
      description: |
        Sends E003 to `content` and adds a log entry (`subject_line` "Test
        email for Monica" in the user's locale).
      x-permission: user
      x-inventory: [R225]
      x-services: [SendTestEmail]
      parameters:
        - $ref: '#/components/parameters/NotificationChannelId'
      responses:
        '204': { $ref: '#/components/responses/NoContent' }
        '401': { $ref: '#/components/responses/Unauthenticated' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }

  /me/notification-channels/{notification_channel_id}/verify:
    post:
      operationId: verifyNotificationChannel
      tags: [Me]
      summary: Verify a channel's email address from the emailed link
      description: |
        Called by the SPA page the verification link opens, which then shows
        the channels list (R224). Sets `verified_at` and schedules the user's
        contact reminders on the channel. `token` must equal the channel's
        `verification_token` (422 otherwise).
      x-permission: user
      x-inventory: [R224]
      x-services: [VerifyUserNotificationChannelEmailAddress, ScheduleAllContactRemindersForNotificationChannel]
      parameters:
        - $ref: '#/components/parameters/NotificationChannelId'
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/NotificationChannelVerification' }
      responses:
        '200':
          description: The verified channel.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/NotificationChannel' }
        '401': { $ref: '#/components/responses/Unauthenticated' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '422': { $ref: '#/components/responses/ValidationFailed' }

  /me/notification-channels/{notification_channel_id}/logs:
    get:
      operationId: listNotificationChannelLogs
      tags: [Me]
      summary: Notifications sent on a channel, newest first
      description: Rows of `user_notification_sent`, ordered by `sent_at` descending.
      x-permission: user
      x-inventory: [R228]
      x-services: []
      parameters:
        - $ref: '#/components/parameters/NotificationChannelId'
        - $ref: '#/components/parameters/Page'
        - name: per_page
          in: query
          schema: { type: integer, minimum: 1, maximum: 100, default: 100 }
      responses:
        '200':
          description: The log entries.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/NotificationLogList' }
        '401': { $ref: '#/components/responses/Unauthenticated' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }

components:
  parameters:
    NotificationChannelId:
      name: notification_channel_id
      in: path
      required: true
      schema: { $ref: '#/components/schemas/Id' }

  schemas:
    # ------------------------------------------------------------ user
    CurrentUser:
      type: object
      required: [id, account_id, first_name, last_name, email, email_verified_at, is_account_administrator, is_instance_administrator, two_factor_enabled, preferences, created_at, updated_at]
      properties:
        id: { $ref: '#/components/schemas/Uuid' }
        account_id: { $ref: '#/components/schemas/Uuid' }
        first_name: { type: [string, 'null'] }
        last_name: { type: [string, 'null'] }
        email: { type: string, format: email }
        email_verified_at:
          description: Null until the email is verified; most endpoints answer 403 `email_not_verified` until then.
          oneOf:
            - $ref: '#/components/schemas/Timestamp'
            - type: 'null'
        is_account_administrator: { type: boolean }
        is_instance_administrator: { type: boolean, description: X010. }
        two_factor_enabled:
          type: boolean
          description: Computed. True when a 2FA secret exists and `two_factor_confirmed_at` is set.
        preferences: { $ref: '#/components/schemas/UserPreferences' }
        created_at: { $ref: '#/components/schemas/Timestamp' }
        updated_at: { $ref: '#/components/schemas/Timestamp' }
    CurrentUserUpdate:
      type: object
      minProperties: 1
      properties:
        first_name: { type: string, minLength: 1, maxLength: 255 }
        last_name: { type: string, minLength: 1, maxLength: 255 }
        email: { type: string, format: email, maxLength: 255, description: Unique across users. }
    PasswordUpdate:
      type: object
      required: [current_password, password, password_confirmation]
      properties:
        current_password: { type: string }
        password: { $ref: '#/components/schemas/NewPassword' }
        password_confirmation: { type: string, description: Must equal `password`. }
    UserPreferences:
      type: object
      required: [name_order, contact_sort_order, date_format, timezone, number_format, distance_format, default_map_site, locale, help_shown]
      properties:
        name_order:
          type: string
          maxLength: 255
          description: |
            How contact names are built: text with `%field%` variables
            (`first_name`, `last_name`, `middle_name`, `nickname`,
            `maiden_name`). The client applies it as `NameHelper` does (X015).
          examples: ['%first_name% %last_name%', '%last_name% %first_name%', '%first_name% %last_name% (%nickname%)', '%nickname%']
        contact_sort_order:
          type: string
          enum: [last_updated, asc, desc]
          description: Default order of the contacts list (R038); `asc`/`desc` sort on the first variable of `name_order`.
        date_format:
          type: string
          enum: ['MMM DD, YYYY', 'DD MMM YYYY', 'YYYY/MM/DD', 'DD/MM/YYYY']
          description: Moment-style pattern the client formats dates with.
        timezone:
          type: [string, 'null']
          description: IANA zone id (see listReferenceTimezones); null means UTC.
        number_format:
          type: string
          enum: [locale, '1,234.56', '1 234,56', '1.234,56', '1234.56']
          description: '`locale` uses the locale''s convention.'
        distance_format: { type: string, enum: [km, mi] }
        default_map_site: { type: string, enum: [google_maps, open_street_maps] }
        locale: { $ref: '#/components/schemas/LocaleCode' }
        help_shown: { type: boolean, description: Show help links next to features. }
    UserPreferencesUpdate:
      type: object
      minProperties: 1
      properties:
        name_order:
          type: string
          minLength: 2
          maxLength: 255
          description: Must contain at least one variable and an even number of `%`.
        contact_sort_order: { type: string, enum: [last_updated, asc, desc] }
        date_format: { type: string, enum: ['MMM DD, YYYY', 'DD MMM YYYY', 'YYYY/MM/DD', 'DD/MM/YYYY'] }
        timezone: { type: string, maxLength: 255, description: A zone id from listReferenceTimezones. }
        number_format: { type: string, enum: [locale, '1,234.56', '1 234,56', '1.234,56', '1234.56'] }
        distance_format: { type: string, enum: [km, mi] }
        default_map_site: { type: string, enum: [google_maps, open_street_maps] }
        locale: { $ref: '#/components/schemas/LocaleCode' }
        help_shown: { type: boolean }

    # ------------------------------------------------------------ bootstrap
    Bootstrap:
      type: object
      required: [user, vaults, instance]
      properties:
        user: { $ref: '#/components/schemas/CurrentUser' }
        vaults:
          type: array
          description: The user's vaults in their account, sorted by name (collation-aware).
          items: { $ref: '#/components/schemas/BootstrapVault' }
        instance: { $ref: '#/components/schemas/Instance' }
    BootstrapVault:
      type: object
      description: What the layout shows for the current vault (today `layoutData.vault`).
      required: [id, name, permission, show_group_tab, show_tasks_tab, show_files_tab, show_journal_tab, show_companies_tab, show_reports_tab, show_calendar_tab]
      properties:
        id: { $ref: '#/components/schemas/Uuid' }
        name: { type: string }
        permission:
          type: integer
          enum: [100, 200, 300]
          description: The user's permission in the vault (100 manage, 200 edit, 300 view).
        show_group_tab: { type: boolean }
        show_tasks_tab: { type: boolean }
        show_files_tab: { type: boolean }
        show_journal_tab: { type: boolean }
        show_companies_tab: { type: boolean }
        show_reports_tab: { type: boolean }
        show_calendar_tab: { type: boolean }

    # ------------------------------------------------------------ 2FA
    TwoFactorSetup:
      type: object
      required: [secret, otpauth_url, qr_code_svg, recovery_codes]
      properties:
        secret: { type: string, description: Base32 TOTP secret for manual entry. }
        otpauth_url: { type: string, description: '`otpauth://totp/...` URL encoded in the QR code.' }
        qr_code_svg: { type: string, description: SVG markup of the QR code. }
        recovery_codes:
          type: array
          items: { type: string }
    TwoFactorConfirm:
      type: object
      required: [code]
      properties:
        code: { type: string, pattern: '^[0-9]{6}$' }
    TwoFactorRecoveryCodes:
      type: object
      required: [recovery_codes]
      properties:
        recovery_codes:
          type: array
          items: { type: string }

    # ------------------------------------------------------------ sessions
    Session:
      type: object
      required: [ip_address, user_agent, is_desktop, platform, browser, is_current_device, last_activity]
      properties:
        ip_address: { type: [string, 'null'] }
        user_agent: { type: [string, 'null'] }
        is_desktop: { type: boolean, description: Computed from `user_agent`. }
        platform: { type: [string, 'null'], description: Computed from `user_agent`; null when unknown. }
        browser: { type: [string, 'null'], description: Computed from `user_agent`; null when unknown. }
        is_current_device: { type: boolean, description: This request's session. }
        last_activity: { $ref: '#/components/schemas/Timestamp' }
    SessionList:
      type: object
      required: [data]
      properties:
        data:
          type: array
          items: { $ref: '#/components/schemas/Session' }

    # ------------------------------------------------------------ tokens
    PersonalAccessToken:
      type: object
      required: [id, name, abilities, last_used_at, expires_at, created_at, updated_at]
      properties:
        id: { $ref: '#/components/schemas/Id' }
        name: { type: string }
        abilities:
          type: array
          uniqueItems: true
          description: '`read` allows GET and HEAD; anything else needs `write`.'
          items: { type: string, enum: [read, write] }
        last_used_at:
          oneOf:
            - $ref: '#/components/schemas/Timestamp'
            - type: 'null'
        expires_at:
          oneOf:
            - $ref: '#/components/schemas/Timestamp'
            - type: 'null'
        created_at: { $ref: '#/components/schemas/Timestamp' }
        updated_at: { $ref: '#/components/schemas/Timestamp' }
    PersonalAccessTokenList:
      type: object
      required: [data]
      properties:
        data:
          type: array
          items: { $ref: '#/components/schemas/PersonalAccessToken' }
    PersonalAccessTokenCreate:
      type: object
      required: [name]
      properties:
        name: { type: string, minLength: 1, maxLength: 255 }
        abilities:
          type: array
          uniqueItems: true
          default: [read]
          items: { type: string, enum: [read, write] }
    PersonalAccessTokenCreated:
      type: object
      required: [token, plain_text_token]
      properties:
        token: { $ref: '#/components/schemas/PersonalAccessToken' }
        plain_text_token:
          type: string
          description: 'Shown only in this response. Send it as `Authorization: Bearer <plain_text_token>`.'
    PersonalAccessTokenUpdate:
      type: object
      required: [abilities]
      properties:
        abilities:
          type: array
          uniqueItems: true
          items: { type: string, enum: [read, write] }

    # ------------------------------------------------------------ notification channels
    NotificationChannel:
      type: object
      required: [id, type, label, content, preferred_time, active, fails, verified_at, created_at, updated_at]
      properties:
        id: { $ref: '#/components/schemas/Id' }
        type: { type: string, enum: [email] }
        label: { type: [string, 'null'] }
        content: { type: string, description: The email address. }
        preferred_time:
          type: [string, 'null']
          pattern: '^([01][0-9]|2[0-3]):[0-5][0-9]$'
          description: Local time (user's timezone) reminders are sent at, `HH:MM`.
        active: { type: boolean }
        fails:
          type: integer
          minimum: 0
          description: Consecutive send failures; at 10 (`max_notification_failures`) the channel is deactivated.
        verified_at:
          description: Null until the address is verified; the UI offers activate and test only once verified.
          oneOf:
            - $ref: '#/components/schemas/Timestamp'
            - type: 'null'
        created_at: { $ref: '#/components/schemas/Timestamp' }
        updated_at: { $ref: '#/components/schemas/Timestamp' }
    NotificationChannelList:
      type: object
      required: [data]
      properties:
        data:
          type: array
          items: { $ref: '#/components/schemas/NotificationChannel' }
    NotificationChannelCreate:
      type: object
      required: [label, content, preferred_time]
      properties:
        label: { type: string, minLength: 1, maxLength: 255 }
        content: { type: string, format: email, maxLength: 255 }
        preferred_time: { type: string, pattern: '^([01][0-9]|2[0-3]):[0-5][0-9]$', examples: ['09:00'] }
    NotificationChannelUpdate:
      type: object
      required: [active]
      properties:
        active: { type: boolean }
    NotificationChannelVerification:
      type: object
      required: [token]
      properties:
        token: { $ref: '#/components/schemas/Uuid' }
    NotificationLog:
      type: object
      required: [id, sent_at, subject_line, error]
      properties:
        id: { $ref: '#/components/schemas/Id' }
        sent_at: { $ref: '#/components/schemas/Timestamp' }
        subject_line: { type: string }
        error: { type: [string, 'null'], description: Why sending failed; null when it succeeded. }
    NotificationLogList:
      type: object
      required: [data, meta]
      properties:
        data:
          type: array
          items: { $ref: '#/components/schemas/NotificationLog' }
        meta: { $ref: '#/components/schemas/PaginationMeta' }
