    # ---------------------------------------------------------------- relationship types
    RelationshipGroupType:
      allOf:
        - $ref: '#/components/schemas/TranslatableName'
        - type: object
          required: [id, type, can_be_deleted, types]
          properties:
            id: { $ref: '#/components/schemas/Id' }
            type:
              type: [string, 'null']
              enum: [love, family, null]
              description: Marks the seeded groups the family summary reads; null for others.
            can_be_deleted: { type: boolean }
            types:
              type: array
              items: { $ref: '#/components/schemas/RelationshipType' }
    RelationshipType:
      allOf:
        - $ref: '#/components/schemas/TranslatableName'
        - type: object
          required: [id, relationship_group_type_id, name_reverse_relationship, name_reverse_relationship_translation_key, type, can_be_deleted]
          properties:
            id: { $ref: '#/components/schemas/Id' }
            relationship_group_type_id: { $ref: '#/components/schemas/Id' }
            name_reverse_relationship: { type: [string, 'null'], description: 'The name seen from the other contact (e.g. "child" for "parent").' }
            name_reverse_relationship_translation_key: { type: [string, 'null'] }
            type:
              type: [string, 'null']
              enum: [family, child, null]
              description: |
                As stored: `family` marks the seeded love types (spouse,
                significant other; the PHP constant `TYPE_LOVE` is `family`),
                `child` the seeded parent/child type. Null for others.
            can_be_deleted: { type: boolean }
    RelationshipGroupTypeList:
      type: object
      required: [data]
      properties:
        data:
          type: array
          items: { $ref: '#/components/schemas/RelationshipGroupType' }
    RelationshipGroupTypeCreate:
      type: object
