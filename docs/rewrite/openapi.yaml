      properties:
        id:
          $ref: '#/components/schemas/Uuid'
        hash:
          type: string
          description: SHA-1 of the email the link was sent to.
        expires:
          type: integer
          description: Unix time the link expires (60 minutes after sending).
        signature:
          type: string
    PasswordResetLinkRequest:
      type: object
      required:
      - email
      properties:
        email:
          type: string
          format: email
    PasswordReset:
      type: object
      required:
      - token
      - email
      - password
      - password_confirmation
      properties:
        token:
          type: string
        email:
          type: string
          format: email
        password:
          $ref: '#/components/schemas/NewPassword'
        password_confirmation:
          type: string
          description: Must equal `password`.
    PasswordConfirmation:
      type: object
      required:
      - password
      properties:
        password:
          type: string
          description: The current password.
    PasswordConfirmationStatus:
      type: object
      required:
      - confirmed
      properties:
        confirmed:
          type: boolean
    CurrentUser:
      type: object
      required:
      - id
      - account_id
      - first_name
      - last_name
      - email
      - email_verified_at
      - is_account_administrator
      - is_instance_administrator
      - two_factor_enabled
      - preferences
      - created_at
      - updated_at
      properties:
        id:
          $ref: '#/components/schemas/Uuid'
        account_id:
          $ref: '#/components/schemas/Uuid'
        first_name:
          type:
          - string
          - 'null'
        last_name:
          type:
          - string
          - 'null'
        email:
          type: string
          format: email
        email_verified_at:
          description: Null until the email is verified; most endpoints answer 403 `email_not_verified`
            until then.
          oneOf:
          - $ref: '#/components/schemas/Timestamp'
          - type: 'null'
        is_account_administrator:
          type: boolean
        is_instance_administrator:
          type: boolean
          description: X010.
        two_factor_enabled:
          type: boolean
          description: Computed. True when a 2FA secret exists and `two_factor_confirmed_at` is set.
        preferences:
          $ref: '#/components/schemas/UserPreferences'
        created_at:
          $ref: '#/components/schemas/Timestamp'
        updated_at:
          $ref: '#/components/schemas/Timestamp'
    CurrentUserUpdate:
      type: object
      minProperties: 1
      properties:
        first_name:
          type: string
          minLength: 1
          maxLength: 255
        last_name:
          type: string
          minLength: 1
          maxLength: 255
        email:
          type: string
          format: email
          maxLength: 255
          description: Unique across users.
    PasswordUpdate:
      type: object
      required:
      - current_password
      - password
      - password_confirmation
      properties:
        current_password:
          type: string
        password:
          $ref: '#/components/schemas/NewPassword'
        password_confirmation:
          type: string
          description: Must equal `password`.
    UserPreferences:
      type: object
      required:
      - name_order
      - contact_sort_order
      - date_format
      - timezone
      - number_format
      - distance_format
      - default_map_site
      - locale
      - help_shown
      properties:
        name_order:
          type: string
          maxLength: 255
          description: 'How contact names are built: text with `%field%` variables

            (`first_name`, `last_name`, `middle_name`, `nickname`,

            `maiden_name`). The client applies it as `NameHelper` does (X015).

            '
          examples:
          - '%first_name% %last_name%'
          - '%last_name% %first_name%'
          - '%first_name% %last_name% (%nickname%)'
          - '%nickname%'
        contact_sort_order:
          type: string
          enum:
          - last_updated
          - asc
          - desc
          description: Default order of the contacts list (R038); `asc`/`desc` sort on the first variable
            of `name_order`.
        date_format:
          type: string
          enum:
          - MMM DD, YYYY
          - DD MMM YYYY
          - YYYY/MM/DD
          - DD/MM/YYYY
          description: Moment-style pattern the client formats dates with.
        timezone:
          type:
          - string
          - 'null'
          description: IANA zone id (see listReferenceTimezones); null means UTC.
        number_format:
          type: string
          enum:
          - locale
          - 1,234.56
          - 1 234,56
          - 1.234,56
          - '1234.56'
          description: '`locale` uses the locale''s convention.'
        distance_format:
          type: string
          enum:
          - km
          - mi
        default_map_site:
          type: string
          enum:
          - google_maps
          - open_street_maps
        locale:
          $ref: '#/components/schemas/LocaleCode'
        help_shown:
          type: boolean
          description: Show help links next to features.
    UserPreferencesUpdate:
      type: object
      minProperties: 1
      properties:
        name_order:
          type: string
          minLength: 2
          maxLength: 255
          description: Must contain at least one variable and an even number of `%`.
        contact_sort_order:
          type: string
          enum:
          - last_updated
          - asc
          - desc
        date_format:
          type: string
          enum:
          - MMM DD, YYYY
          - DD MMM YYYY
          - YYYY/MM/DD
          - DD/MM/YYYY
        timezone:
          type: string
          maxLength: 255
          description: A zone id from listReferenceTimezones.
        number_format:
          type: string
          enum:
          - locale
          - 1,234.56
          - 1 234,56
          - 1.234,56
          - '1234.56'
        distance_format:
          type: string
          enum:
          - km
          - mi
        default_map_site:
          type: string
          enum:
          - google_maps
          - open_street_maps
        locale:
          $ref: '#/components/schemas/LocaleCode'
        help_shown:
          type: boolean
