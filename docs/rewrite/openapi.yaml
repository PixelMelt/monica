      - ar
      - bn
      - ca
      - da
      - de
      - es
      - el
      - fr
      - he
      - hi
      - it
      - ja
      - ml
      - nl
      - nn
      - pa
      - pl
      - pt
      - pt_BR
      - ro
      - ru
      - sv
      - te
      - tr
      - ur
      - vi
      - zh_CN
      - zh_TW
    Locale:
      type: object
      required:
      - id
      - name
      - dir
      properties:
        id:
          $ref: '#/components/schemas/LocaleCode'
        name:
          type: string
          description: The language's own name (`auth.lang` in that locale), e.g. `Français`.
        dir:
          type: string
          enum:
          - ltr
          - rtl
    Instance:
      type: object
