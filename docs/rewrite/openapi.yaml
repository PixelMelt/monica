    Post:
      type: object
      description: A post with everything its show and edit pages display.
      required:
      - id
      - journal
      - slice_of_life
      - title
      - published
      - written_at
      - view_count
      - word_count
      - time_to_read_in_minute
      - sections
      - tags
      - contacts
      - photos
      - metrics
      - mood_tracking_events
      - previous_post
      - next_post
      - can_upload_file
      - created_at
      - updated_at
      properties:
        id:
          $ref: '#/components/schemas/Id'
        can_upload_file:
          type: boolean
          description: 'Computed: the account is under its storage limit (X011); the edit page hides the
            photo upload otherwise.'
        journal:
          type: object
          required:
          - id
          - name
          properties:
            id:
              $ref: '#/components/schemas/Id'
            name:
              type: string
        slice_of_life:
          oneOf:
          - $ref: '#/components/schemas/SliceOfLife'
          - type: 'null'
        title:
          type:
          - string
          - 'null'
          description: Null when untitled (the client shows its "Undefined" label).
        published:
          type: boolean
        written_at:
          description: The column is a datetime; the API uses its date.
          $ref: '#/components/schemas/Date'
        view_count:
          type: integer
          minimum: 0
        word_count:
          type: integer
          minimum: 0
          description: Computed. Words in all section contents.
        time_to_read_in_minute:
          type: integer
          minimum: 1
          description: Computed. `max(1, round(word_count / 200))`.
        sections:
          type: array
          description: All sections, by `position`. The show page hides those whose `content` is null.
          items:
            $ref: '#/components/schemas/PostSection'
        tags:
          type: array
          description: The post's tags, by name.
          items:
            $ref: '#/components/schemas/Tag'
        contacts:
          type: array
          description: Contacts mentioned in the post, with what the show page's hover card shows (`ContactCardHelper`).
          items:
            $ref: '#/components/schemas/ContactCard'
        photos:
          type: array
          description: The post's photos, by id.
          items:
            $ref: '#/components/schemas/File'
        metrics:
          type: array
          description: One entry per metric of the journal (by id), with this post's values.
          items:
            type: object
            required:
            - journal_metric
            - total
            - post_metrics
            properties:
              journal_metric:
                $ref: '#/components/schemas/JournalMetric'
              total:
                type: integer
                description: Computed. Sum of the values in `post_metrics`.
              post_metrics:
                type: array
                items:
                  $ref: '#/components/schemas/PostMetric'
        mood_tracking_events:
          description: 'Computed, per requesting user: the mood tracking events of the

            user''s own contact in this vault rated on `written_at`''s date. Null

            when the user has no contact in the vault.

            '
          oneOf:
          - type: array
            items:
              $ref: '#/components/schemas/MoodTrackingEvent'
          - type: 'null'
        previous_post:
          description: Computed. The latest post of the journal written on an earlier day, or null.
          oneOf:
          - $ref: '#/components/schemas/PostNeighbour'
          - type: 'null'
        next_post:
          description: Computed. The earliest post of the journal written on a later day, or null.
          oneOf:
          - $ref: '#/components/schemas/PostNeighbour'
          - type: 'null'
        created_at:
          $ref: '#/components/schemas/Timestamp'
        updated_at:
          $ref: '#/components/schemas/Timestamp'
