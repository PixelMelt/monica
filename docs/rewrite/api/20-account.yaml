        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/GenderUpdate' }
      responses:
        '200':
          description: The updated gender.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Gender' }
        '401': { $ref: '#/components/responses/Unauthenticated' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '422': { $ref: '#/components/responses/ValidationFailed' }
    delete:
      operationId: deleteGender
      tags: [Account]
      summary: Delete a gender
      description: Contacts with this gender get `gender_id` null.
      x-permission: account:admin
      x-inventory: [R281]
      x-services: [DestroyGender]
      responses:
        '204': { $ref: '#/components/responses/NoContent' }
        '401': { $ref: '#/components/responses/Unauthenticated' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }

