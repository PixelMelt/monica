          type:
          - string
          - 'null'
        last_name:
          type:
          - string
          - 'null'
        contact:
          oneOf:
          - $ref: '#/components/schemas/ContactSummary'
          - type: 'null'
    File:
      type: object
      required:
      - id
      - uuid
      - name
      - mime_type
      - size
      - type
      - created_at
      properties:
        id:
          $ref: '#/components/schemas/Id'
        uuid:
          $ref: '#/components/schemas/Uuid'
        name:
          type: string
        mime_type:
          type: string
        size:
          type: integer
