components:
  schemas:
    # ---------------------------------------------------------------- account
    Account:
      type: object
      required: [id, created_at, updated_at]
      properties:
        id: { $ref: '#/components/schemas/Uuid' }
        created_at: { $ref: '#/components/schemas/Timestamp' }
        updated_at: { $ref: '#/components/schemas/Timestamp' }
    EmotionList:
      type: object
      required: [data]
      properties:
        data:
          type: array
          items: { $ref: '#/components/schemas/Emotion' }

    # ---------------------------------------------------------------- users
    AccountUser:
      type: object
      required: [id, username, first_name, last_name, is_account_administrator, created_at, updated_at]
      properties:
        id: { $ref: '#/components/schemas/Uuid' }
        username: { $ref: '#/components/schemas/Username' }
        first_name: { type: [string, 'null'] }
        last_name: { type: [string, 'null'] }
        is_account_administrator: { type: boolean }
        created_at: { $ref: '#/components/schemas/Timestamp' }
        updated_at: { $ref: '#/components/schemas/Timestamp' }
    AccountUserList:
      type: object
      required: [data]
      properties:
        data:
          type: array
          items: { $ref: '#/components/schemas/AccountUser' }
    AccountUserCreate:
      type: object
      required: [first_name, last_name, username, password, password_confirmation]
      properties:
        first_name: { type: string, minLength: 1, maxLength: 255 }
        last_name: { type: string, minLength: 1, maxLength: 255 }
        username: { $ref: '#/components/schemas/Username' }
        password: { $ref: '#/components/schemas/NewPassword' }
        password_confirmation: { type: string, description: Must equal `password`. }
        is_account_administrator: { type: boolean, default: false }
    AccountUserUpdate:
      type: object
      minProperties: 1
      properties:
        is_account_administrator: { type: boolean }
    DeleteAccountUserRequest:
      type: object
      properties:
        password:
          type: string
          description: The current password, unless the session confirmed it recently (api-design.md §7.4).

    # ---------------------------------------------------------------- genders
    Gender:
      allOf:
        - $ref: '#/components/schemas/TranslatableName'
        - type: object
          required: [id, type]
          properties:
            id: { $ref: '#/components/schemas/Id' }
            type:
              type: [string, 'null']
              enum: ['M', 'F', 'O', 'U', 'N', null]
              description: vCard gender code, used by the DAV export. Seeded and user-created genders have none.
    GenderList:
      type: object
      required: [data]
      properties:
        data:
          type: array
          items: { $ref: '#/components/schemas/Gender' }
    GenderCreate:
      type: object
      required: [name]
      properties:
        name: { type: string, minLength: 1, maxLength: 255 }
    GenderUpdate:
      type: object
      minProperties: 1
      properties:
        name: { type: string, minLength: 1, maxLength: 255 }

    # ---------------------------------------------------------------- pronouns
    Pronoun:
      allOf:
        - $ref: '#/components/schemas/TranslatableName'
        - type: object
          required: [id]
          properties:
            id: { $ref: '#/components/schemas/Id' }
    PronounList:
      type: object
      required: [data]
      properties:
        data:
          type: array
          items: { $ref: '#/components/schemas/Pronoun' }
    PronounCreate:
      type: object
      required: [name]
      properties:
        name: { type: string, minLength: 1, maxLength: 255 }
    PronounUpdate:
      type: object
      minProperties: 1
      properties:
        name: { type: string, minLength: 1, maxLength: 255 }

    # ---------------------------------------------------------------- address types
    AddressType:
      allOf:
        - $ref: '#/components/schemas/TranslatableName'
        - type: object
          required: [id, type]
          properties:
            id: { $ref: '#/components/schemas/Id' }
            type:
              type: [string, 'null']
              description: |
                vCard address type used by the DAV export. Seeded: `home`,
                `secondary`, `work`, `chalet`, `other`; user-created default `custom`.
    AddressTypeList:
      type: object
      required: [data]
      properties:
        data:
          type: array
          items: { $ref: '#/components/schemas/AddressType' }
    AddressTypeCreate:
      type: object
      required: [name]
      properties:
        name: { type: string, minLength: 1, maxLength: 255 }
        type: { type: [string, 'null'], maxLength: 255, description: Defaults to `custom`. }
    AddressTypeUpdate:
      type: object
      minProperties: 1
      properties:
        name: { type: string, minLength: 1, maxLength: 255 }

    # ---------------------------------------------------------------- pet categories
    PetCategory:
      allOf:
        - $ref: '#/components/schemas/TranslatableName'
        - type: object
          required: [id]
          properties:
            id: { $ref: '#/components/schemas/Id' }
    PetCategoryList:
      type: object
      required: [data]
      properties:
        data:
          type: array
          items: { $ref: '#/components/schemas/PetCategory' }
    PetCategoryCreate:
      type: object
      required: [name]
      properties:
        name: { type: string, minLength: 1, maxLength: 255 }
    PetCategoryUpdate:
      type: object
      minProperties: 1
      properties:
        name: { type: string, minLength: 1, maxLength: 255 }

    # ---------------------------------------------------------------- contact information types
    ContactInformationType:
      allOf:
        - $ref: '#/components/schemas/TranslatableName'
        - type: object
          required: [id, protocol, type, can_be_deleted]
          properties:
            id: { $ref: '#/components/schemas/Id' }
            protocol: { type: [string, 'null'], description: 'Prefix that makes the value clickable, e.g. `mailto:`, `tel:`.' }
            type:
              type: [string, 'null']
              description: |
                Group: `email`, `phone` (one seeded type each, not deletable),
                `IMPP` or `X-SOCIAL-PROFILE`.
            can_be_deleted: { type: boolean }
    ContactInformationTypeList:
      type: object
      required: [data]
      properties:
        data:
          type: array
          items: { $ref: '#/components/schemas/ContactInformationType' }
    ContactInformationTypeCreate:
      type: object
      required: [name, type]
      properties:
        name: { type: string, minLength: 1, maxLength: 255 }
        type: { type: string, minLength: 1, maxLength: 255, description: The settings page offers `IMPP` and `X-SOCIAL-PROFILE`. }
        protocol: { type: [string, 'null'], maxLength: 255 }
    ContactInformationTypeUpdate:
      type: object
      minProperties: 1
      properties:
        name: { type: string, minLength: 1, maxLength: 255 }
        type: { type: string, minLength: 1, maxLength: 255 }
        protocol: { type: [string, 'null'], maxLength: 255 }

    # ---------------------------------------------------------------- call reasons
    CallReasonType:
      type: object
      description: Seeded rows have `label_translation_key`; the client shows `label` when set, else translates the key.
      required: [id, label, label_translation_key, reasons]
      properties:
        id: { $ref: '#/components/schemas/Id' }
        label: { type: [string, 'null'] }
        label_translation_key: { type: [string, 'null'] }
        reasons:
          type: array
          items: { $ref: '#/components/schemas/CallReason' }
    CallReason:
      type: object
