        in: header
        description: Byte range (`original` only).
        schema:
          type: string
      - name: If-None-Match
        in: header
        schema:
          type: string
      responses:
        '200':
          description: The bytes. `Content-Type` is the file's `mime_type` (JPEG or PNG for thumbnails).
          headers:
            Content-Length:
              schema:
                type: integer
            ETag:
              schema:
                type: string
            Cache-Control:
              description: '`private, max-age=31536000, immutable`'
              schema:
                type: string
            Content-Disposition:
              description: '`inline` for images, `attachment` (with the file name) for documents.'
              schema:
                type: string
            Accept-Ranges:
              schema:
                type: string
                enum:
                - bytes
          content:
            '*/*':
              schema:
                type: string
                contentMediaType: application/octet-stream
        '206':
